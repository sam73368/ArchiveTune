name: TV focus probe

on:
  workflow_dispatch:
  push:
    branches:
      - tv-probe

permissions:
  contents: write

concurrency:
  group: tv-focus-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up build environment
        uses: ./.github/actions/setup-build
        with:
          variant-key: tv-probe-x86

      - name: Build TV x86 debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --console=plain assembleGmsTvX86Debug --warning-mode summary 2>&1 | tee build.log || {
            grep -E "^e: |What went wrong" -A2 build.log | head -40 | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          }
          find app/build/outputs/apk -name '*.apk' | head
          cp "$(find app/build/outputs/apk -name '*.apk' -path '*ebug*' | head -n 1)" probe.apk
        env:
          PULL_REQUEST: "true"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run probe on Android TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            adb install -r -g probe.apk
            adb shell pm list packages | grep archivetune || true
            python3 scripts/tv_probe.py || true
            bash scripts/tv_probe_publish.sh probe-out || true

      - name: Publish probe results
        if: always()
        shell: bash
        run: |
          set -x
          mkdir -p /tmp/results && cp -r probe-out/. /tmp/results/ 2>/dev/null || true
          head -c 60000 /tmp/results/report.txt || true
          while IFS= read -r line; do echo "::notice::${line:0:900}"; done < <(head -n 45 /tmp/results/report.txt 2>/dev/null)
          git config user.name "tv-probe"
          git config user.email "tv-probe@users.noreply.github.com"
          git checkout --orphan tv-probe-results
          git rm -rf --cached . >/dev/null
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/results/. .
          git add -A
          git commit -m "probe ${GITHUB_SHA}" || true
          git push -f origin tv-probe-results
