name: TV crawl

on:
  workflow_dispatch:
  push:
    branches:
      - tv-crawl

permissions:
  contents: write

concurrency:
  group: tv-crawl
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up build environment
        uses: ./.github/actions/setup-build
        with:
          variant-key: tv-crawl-x86

      - name: Build TV x86 debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --console=plain assembleGmsTvX86Debug --warning-mode summary 2>&1 | tee build.log || {
            grep -E "^e: |What went wrong" -A2 build.log | head -40 | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          }
          find app/build/outputs/apk -name '*.apk' | head
          cp "$(find app/build/outputs/apk -name '*.apk' -path '*ebug*' | head -n 1)" probe.apk
        env:
          PULL_REQUEST: "true"

      - name: Free disk space
        run: |
          df -h / | tail -1
          ./gradlew --stop || true
          rm -rf app/build */build build .gradle ~/.gradle/caches/build-cache-* ~/.gradle/caches/transforms-* || true
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/lib/android/sdk/ndk /usr/share/swift /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1
          free -m

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick

      - name: Run probe on Android TV emulator
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          emulator-boot-timeout: 900
          script: |
            adb install -r -g probe.apk
            adb shell pm list packages | grep archivetune || true
            python3 scripts/tv_crawl.py || true
            bash scripts/tv_crawl_publish.sh crawl-out || true

      - name: Publish probe results
        if: always()
        shell: bash
        run: |
          set -x
          mkdir -p /tmp/results && cp -r crawl-out/. /tmp/results/ 2>/dev/null || true
          head -c 60000 /tmp/results/report.txt || true
          while IFS= read -r line; do echo "::notice::${line:0:900}"; done < <(head -n 45 /tmp/results/report.txt 2>/dev/null)
          git config user.name "tv-crawl"
          git config user.email "tv-crawl@users.noreply.github.com"
          git checkout --orphan tv-crawl-results
          git rm -rf --cached . >/dev/null
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/results/. .
          git add -A
          git commit -m "crawl ${GITHUB_SHA}" || true
          git push -f origin tv-crawl-results
