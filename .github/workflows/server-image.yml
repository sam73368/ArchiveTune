name: Server image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "core/**"
      - "gradle/libs.versions.toml"
      - ".github/workflows/server-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile and test
        run: |
          chmod +x gradlew
          if ! ./gradlew -p server :server:installDist :server:test --console=plain > server-build.log 2>&1; then
            block=$(sed -n '/What went wrong/,/Try:/p' server-build.log | head -80)
            errors=$(grep -E "^e: " server-build.log | head -40)
            msg=$(printf '%s\n---\n%s' "$block" "$errors")
            msg="${msg//'%'/'%25'}"
            msg="${msg//$'\n'/'%0A'}"
            msg="${msg//$'\r'/'%0D'}"
            echo "::error title=server build failed::${msg}"
            ./gradlew -p server projects :core:outgoingVariants --console=plain > server-diag.log 2>&1 || true
            diag=$(head -70 server-diag.log)
            diag="${diag//'%'/'%25'}"
            diag="${diag//$'\n'/'%0A'}"
            diag="${diag//$'\r'/'%0D'}"
            echo "::error title=diagnostics::${diag}"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/archivetune-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
