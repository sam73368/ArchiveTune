<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1014">
<link rel="manifest" href="/manifest.webmanifest">
<title>ArchiveTune</title>
<style>
:root{
  --bg:#0e1014;--surface:#161a20;--surface2:#1d222a;--surface3:#262c36;--line:#2c333e;
  --text:#e8eaf0;--muted:#9aa3b2;--primary:#a8c7fa;--on-primary:#062e6f;--accent:#7cacf8;--danger:#ffb4ab;
  --radius:18px;--player-h:76px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Google Sans","Roboto",system-ui,-apple-system,sans-serif}
body{padding-bottom:calc(var(--player-h) + 24px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
img{display:block}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 70%,transparent);padding:12px 0 8px}
.top{display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:.2px}
.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--primary),#c3a6ff);display:grid;place-items:center;color:var(--on-primary)}
.spacer{flex:1}
.pill{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--surface2);color:var(--text);max-width:46vw;min-width:0}
.icon-btn{flex:none}
.brand{min-width:0;white-space:nowrap}
@media (max-width:440px){.brand .name{display:none}}
.pill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface2)}
.icon-btn:active,.pill:active{background:var(--surface3)}
svg{width:22px;height:22px;fill:currentColor;flex:none}
.search{margin-top:12px;display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:999px;padding:4px 6px 4px 16px}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;padding:10px 0;font-size:16px}
.chips{display:flex;gap:8px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.chip{padding:8px 16px;border-radius:10px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.on{background:var(--primary);color:var(--on-primary);border-color:transparent;font-weight:600}
h2{font-size:20px;margin:22px 0 10px}
.muted{color:var(--muted)}
.list{display:flex;flex-direction:column;gap:2px}
.row{display:flex;align-items:center;gap:14px;padding:8px;border-radius:14px;cursor:pointer}
.row:hover{background:var(--surface)}
.row.playing .t1{color:var(--primary)}
.thumb{width:52px;height:52px;border-radius:10px;object-fit:cover;background:var(--surface3);flex:none}
.thumb.round{border-radius:50%}
.num{width:28px;text-align:center;color:var(--muted);flex:none}
.txt{flex:1;min-width:0}
.t1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.t2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:var(--muted);margin-top:2px}
.e{display:inline-grid;place-items:center;width:15px;height:15px;font-size:10px;border-radius:3px;background:var(--muted);color:var(--bg);font-weight:700;margin-right:6px;vertical-align:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.card{cursor:pointer;min-width:0}
.card img{width:100%;aspect-ratio:1;border-radius:14px;object-fit:cover;background:var(--surface3)}
.card .t1{margin-top:8px}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:150px;gap:16px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.hero{display:flex;gap:20px;align-items:flex-end;margin-top:8px;flex-wrap:wrap}
.hero img{width:200px;height:200px;border-radius:20px;object-fit:cover;box-shadow:0 20px 50px rgba(0,0,0,.5);background:var(--surface3)}
.hero.artist img{border-radius:50%}
.hero h1{margin:0 0 6px;font-size:28px;line-height:1.15}
.actions{display:flex;gap:10px;margin:18px 0 6px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:999px;background:var(--surface2);font-weight:600}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.empty{padding:60px 10px;text-align:center;color:var(--muted)}
.empty .big{font-size:44px;margin-bottom:10px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);margin-top:4px}
.player{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:936px;margin:0 auto;height:var(--player-h);background:var(--surface2);border-radius:20px;display:flex;align-items:center;gap:12px;padding:10px 12px;box-shadow:0 10px 40px rgba(0,0,0,.55);z-index:30;overflow:hidden}
.player.hidden{display:none}
.player img{width:54px;height:54px;border-radius:12px;object-fit:cover;background:var(--surface3)}
.player .txt{cursor:pointer}
.progress{position:absolute;left:0;bottom:0;height:3px;background:var(--primary);width:0;transition:width .5s linear}
.ctrl{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.ctrl.main{background:var(--primary);color:var(--on-primary)}
.ctrl svg{width:26px;height:26px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none}
.sheet{visibility:hidden;position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:var(--surface);border-radius:24px 24px 0 0;z-index:41;padding:10px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s ease;max-height:86vh;overflow:auto}
.sheet.open{transform:none;visibility:visible}
.sheet .grab{width:36px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 12px}
.sheet h3{margin:4px 0 14px;font-size:18px}
.opt{display:flex;align-items:center;gap:14px;padding:12px;border-radius:14px;cursor:pointer}
.opt:hover{background:var(--surface2)}
.opt.on{background:var(--surface3)}
.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.field input{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px;outline:0}
code,.code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--surface2);padding:10px;border-radius:10px;display:block;word-break:break-all;white-space:pre-wrap}
.now{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.now img{width:min(72vw,320px);aspect-ratio:1;border-radius:22px;object-fit:cover;box-shadow:0 20px 60px rgba(0,0,0,.5);background:var(--surface3);margin:8px 0 12px}
.now .controls{display:flex;align-items:center;gap:18px;margin:12px 0}
.now .ctrl{width:56px;height:56px}
.now .ctrl.main{width:68px;height:68px}
.vol{width:100%;accent-color:var(--primary)}
.toast{position:fixed;left:50%;bottom:calc(var(--player-h) + 34px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--surface3);color:var(--text);padding:12px 18px;border-radius:14px;opacity:0;transition:.25s;z-index:60;max-width:90vw;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.err{background:#5c1a14;color:var(--danger)}
.spinner{width:28px;height:28px;border:3px solid var(--surface3);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.suggest{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface2);border-radius:16px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5);display:none;z-index:25}
.suggest div{padding:12px 16px;cursor:pointer;display:flex;gap:12px;align-items:center}
.suggest div:hover,.suggest div.sel{background:var(--surface3)}
.searchbox{position:relative}
.recent{display:flex;flex-wrap:wrap;gap:8px}
.recent .chip{display:inline-flex;align-items:center;gap:6px}
.topcard{display:flex;gap:16px;align-items:center;background:var(--surface);border-radius:20px;padding:14px;cursor:pointer}
.topcard img{width:96px;height:96px;border-radius:14px;object-fit:cover;background:var(--surface3)}
.topcard img.round{border-radius:50%}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:24px 0 10px}
.section-head h2{margin:0}
.link{color:var(--primary);font-weight:600;font-size:14px;padding:6px 10px;border-radius:10px}
.link:hover{background:var(--surface2)}
.artist-hero{position:relative;margin:4px -16px 0;padding:120px 16px 18px;overflow:hidden;border-radius:0 0 28px 28px}
.artist-hero .bg{position:absolute;inset:0;background-size:cover;background-position:center 25%;filter:saturate(1.1)}
.artist-hero .shade{position:absolute;inset:0;background:linear-gradient(transparent 0%,rgba(14,16,20,.55) 45%,var(--bg) 100%)}
.artist-hero .content{position:relative}
.artist-hero h1{font-size:40px;margin:0;line-height:1.05}
.circle{width:100%;aspect-ratio:1;border-radius:50% !important}
.about{color:var(--muted);line-height:1.5;font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.about.open{-webkit-line-clamp:unset}
.fade{animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.skel{background:linear-gradient(90deg,var(--surface) 0%,var(--surface2) 50%,var(--surface) 100%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:12px}
@keyframes sh{to{background-position:-200% 0}}
.more{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.more:hover{background:var(--surface3)}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <a class="brand" href="#/" style="color:inherit;text-decoration:none"><div class="logo"><svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg></div><span class="name">ArchiveTune</span></a>
      <div class="spacer"></div>
      <button class="pill" id="deviceBtn" title="Appareil de lecture"><svg viewBox="0 0 24 24"><path d="M1 18v3h3a3 3 0 0 0-3-3zm0-4v2a5 5 0 0 1 5 5h2a7 7 0 0 0-7-7zm0-4v2a9 9 0 0 1 9 9h2A11 11 0 0 0 1 10zm20-7H3a2 2 0 0 0-2 2v3h2V5h18v14h-7v2h7a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"/></svg><span id="deviceName">Ce navigateur</span></button>
      <button class="icon-btn" id="settingsBtn" title="Réglages"><svg viewBox="0 0 24 24"><path d="M19.14 12.94a7.07 7.07 0 0 0 0-1.88l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7 7 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.84a.5.5 0 0 0-.49.42l-.36 2.54a7.3 7.3 0 0 0-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.67 8.48a.5.5 0 0 0 .12.64l2.03 1.58a7.07 7.07 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .6.22l2.39-.96c.5.38 1.05.7 1.63.94l.36 2.54a.5.5 0 0 0 .49.42h3.84a.5.5 0 0 0 .49-.42l.36-2.54a7.3 7.3 0 0 0 1.63-.94l2.39.96a.5.5 0 0 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/></svg></button>
    </div>
    <div class="searchbox">
    <form class="search" id="searchForm">
      <svg viewBox="0 0 24 24" style="color:var(--muted)"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16a6.47 6.47 0 0 0 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
      <input id="q" type="search" placeholder="Chansons, albums, artistes" autocomplete="off" enterkeyhint="search">
      <button type="button" class="icon-btn" id="clearQ" style="display:none;background:none" title="Effacer"><svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
    </form>
    <div class="suggest" id="suggest"></div>
    </div>
    <div class="chips" id="chips">
      <button class="chip on" data-type="all">Tout</button>
      <button class="chip" data-type="song">Chansons</button>
      <button class="chip" data-type="album">Albums</button>
      <button class="chip" data-type="artist">Artistes</button>
    </div>
  </div>
</header>

<main class="wrap" id="view"></main>

<div class="player hidden" id="player">
  <img id="pThumb" alt="">
  <div class="txt" id="pOpen"><div class="t1" id="pTitle"></div><div class="t2" id="pSub"></div></div>
  <button class="ctrl" id="pPrev" title="Précédent"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
  <button class="ctrl main" id="pPlay" title="Lecture/Pause"><svg viewBox="0 0 24 24" id="pPlayIcon"><path d="M8 5v14l11-7z"/></svg></button>
  <button class="ctrl" id="pNext" title="Suivant"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
  <div class="progress" id="pProgress"></div>
</div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>
<audio id="audio" preload="auto"></audio>

<script>
(function () {
  var ICON_PLAY = '<path d="M8 5v14l11-7z"/>';
  var ICON_PAUSE = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
  var view = document.getElementById('view');
  var audio = document.getElementById('audio');
  var state = {
    token: read('archivetune.token') || new URLSearchParams(location.search).get('token') || '',
    device: read('archivetune.device') || '',
    type: 'all',
    queue: [],
    index: -1,
    castStatus: null,
    devices: []
  };

  function read(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function write(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function thumb(url, size) {
    if (!url) return '';
    return url.replace(/=w\d+-h\d+/, '=w' + size + '-h' + size).replace(/=s\d+/, '=s' + size);
  }
  function withToken(path) {
    if (!state.token) return path;
    return path + (path.indexOf('?') >= 0 ? '&' : '?') + 'token=' + encodeURIComponent(state.token);
  }
  var cache = {};
  function cachedApi(path, ttl) {
    var hit = cache[path];
    if (hit && Date.now() - hit.t < (ttl || 300000)) return Promise.resolve(hit.d);
    return api(path).then(function (d) { cache[path] = { t: Date.now(), d: d }; return d; });
  }
  function api(path, body) {
    var opts = { headers: {} };
    if (state.token) opts.headers['Authorization'] = 'Bearer ' + state.token;
    if (body !== undefined) { opts.method = 'POST'; opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
    return fetch(path, opts).then(function (r) {
      return r.text().then(function (text) {
        var data = null;
        try { data = text ? JSON.parse(text) : null; } catch (e) {}
        if (r.status === 401) { openSettings(); throw new Error('Jeton invalide ou manquant'); }
        if (!r.ok) throw new Error((data && data.error) || ('HTTP ' + r.status));
        return data;
      });
    });
  }
  var toastTimer;
  function toast(text, isError) {
    var t = document.getElementById('toast');
    t.textContent = text;
    t.className = 'toast show' + (isError ? ' err' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.className = 'toast'; }, isError ? 5000 : 2600);
  }
  function spinner() { view.innerHTML = '<div class="spinner"></div>'; }
  function isCast() { return !!state.device; }

  function trackRow(t, index, opts) {
    opts = opts || {};
    var lead = opts.numbered
      ? '<div class="num">' + (index + 1) + '</div>'
      : '<img class="thumb" loading="lazy" src="' + esc(thumb(t.thumbnail, 120)) + '" alt="">';
    var sub = (t.explicit ? '<span class="e">E</span>' : '') + esc(t.artists.join(', ')) + (opts.numbered || !t.album ? '' : ' • ' + esc(t.album));
    var dur = t.durationSeconds ? '<div class="muted" style="font-size:13px">' + fmt(t.durationSeconds) + '</div>' : '';
    return '<div class="row" data-i="' + index + '">' + lead + '<div class="txt"><div class="t1">' + esc(t.title) + '</div><div class="t2">' + sub + '</div></div>' + dur +
      '<button class="more" data-more="' + index + '" title="Ajouter à la file"><svg viewBox="0 0 24 24"><path d="M14 10H3v2h11v-2zm0-4H3v2h11V6zm4 8v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zM3 16h7v-2H3v2z"/></svg></button></div>';
  }
  function fmt(sec) {
    sec = Math.max(0, Math.round(sec || 0));
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }
  function bindTrackList(container, tracks, mode) {
    container.querySelectorAll('.row').forEach(function (row) {
      row.addEventListener('click', function (e) {
        if (e.target.closest('[data-more]')) return;
        var i = +row.getAttribute('data-i');
        if (mode === 'album') playList(tracks, i);
        else playSong(tracks[i]);
      });
    });
    container.querySelectorAll('[data-more]').forEach(function (b) {
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        enqueue([tracks[+b.getAttribute('data-more')]]);
      });
    });
  }

  var scrolls = {};
  var pendingScroll = 0;
  function restoreScroll() { window.scrollTo(0, pendingScroll); }
  function go(q) {
    q = (q || '').trim();
    if (!q) return;
    document.getElementById('q').value = q;
    addRecent(q);
    hideSuggest();
    location.hash = '#/search?type=' + state.type + '&q=' + encodeURIComponent(q);
    document.getElementById('q').blur();
  }
  var suggestTimer, suggestSeq = 0, suggestSel = -1;
  function hideSuggest() { document.getElementById('suggest').style.display = 'none'; suggestSel = -1; }
  function showSuggest(list) {
    var box = document.getElementById('suggest');
    if (!list.length) return hideSuggest();
    box.innerHTML = list.map(function (q, i) { return '<div data-s="' + esc(q) + '"><svg viewBox="0 0 24 24" style="width:18px;height:18px;color:var(--muted)"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16a6.47 6.47 0 0 0 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>' + esc(q) + '</div>'; }).join('');
    box.style.display = 'block';
    box.querySelectorAll('[data-s]').forEach(function (d) { d.onmousedown = function (e) { e.preventDefault(); go(d.getAttribute('data-s')); }; });
  }
  function route() {
    var current = location.hash || '#/';
    pendingScroll = scrolls[current] || 0;
    var hash = location.hash.replace(/^#/, '') || '/';
    var parts = hash.split('?');
    var path = parts[0];
    var params = new URLSearchParams(parts[1] || '');
    if (path.indexOf('/album/') === 0) return showAlbum(decodeURIComponent(path.slice(7)));
    if (path.indexOf('/artist/') === 0) return showArtist(decodeURIComponent(path.slice(8)));
    if (path === '/artist-items') return showArtistItems(params.get('browseId'), params.get('params'), params.get('title'), params.get('artist'));
    if (path === '/search') {
      var q = params.get('q') || '';
      state.type = params.get('type') || 'all';
      document.getElementById('q').value = q;
      syncChips();
      return showSearch(q, state.type);
    }
    showHome();
  }
  function syncChips() {
    document.querySelectorAll('.chip').forEach(function (c) { c.classList.toggle('on', c.getAttribute('data-type') === state.type); });
  }
  function recents() { try { return JSON.parse(read('archivetune.recent') || '[]'); } catch (e) { return []; } }
  function addRecent(q) {
    var list = recents().filter(function (x) { return x.toLowerCase() !== q.toLowerCase(); });
    list.unshift(q);
    write('archivetune.recent', JSON.stringify(list.slice(0, 10)));
  }
  function showHome() {
    var r = recents();
    if (r.length) {
      view.innerHTML = '<div class="fade"><div class="section-head"><h2>Recherches récentes</h2><button class="link" id="clearRecent">Effacer</button></div><div class="recent">' + r.map(function (q) {

  function playList(tracks, index) {

    api('/api/devices' + (refresh ? '?refresh=true' : '')).then(function (devices) {
      state.devices = devices;
      var html = '<div class="opt' + (isCast() ? '' : ' on') + '" data-dev=""><svg viewBox="0 0 24 24"><path d="M20 18c1.1 0 2-.9 2-2V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v10c0 1.1.9 2 2 2H0v2h24v-2h-4zM4 6h16v10H4V6z"/></svg><div class="txt"><div class="t1">Ce navigateur</div><div class="t2">Lecture sur cet appareil</div></div></div>';
      html += devices.map(function (d) {
        return '<div class="opt' + (state.device === d.name ? ' on' : '') + '" data-dev="' + esc(d.name) + '"><svg viewBox="0 0 24 24"><path d="M17 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm-5 2a2 2 0 1 1 0 4 2 2 0 0 1 0-4zm0 16a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg><div class="txt"><div class="t1">' + esc(d.name) + '</div><div class="t2">' + esc(d.isGroup ? 'Groupe d\'enceintes' : (d.model || 'Google Cast')) + ' • ' + esc(d.host) + '</div></div></div>';
      }).join('');
      if (!devices.length) html += '<p class="muted" style="padding:6px 12px">Aucun appareil Cast trouvé. Le conteneur doit être en <code style="display:inline;padding:2px 6px">network_mode: host</code>, ou ajoute-les avec ARCHIVETUNE_CAST_DEVICES.</p>';
      document.getElementById('devList').innerHTML = html;
      document.querySelectorAll('[data-dev]').forEach(function (o) {
        o.onclick = function () { selectDevice(o.getAttribute('data-dev')); closeSheet(); };
      });
    }).catch(function (e) { document.getElementById('devList').innerHTML = '<p class="muted">' + esc(e.message) + '</p>'; });
  }
  function selectDevice(name) {
    if (name && !audio.paused) audio.pause();
    state.device = name;
    write('archivetune.device', name);
    document.getElementById('deviceName').textContent = name || 'Ce navigateur';
    state.castStatus = null;
    if (name) { toast('Lecture sur ' + name); pollCast(); } else { clearTimeout(pollTimer); }
  }
  function openSettings() {
    var origin = location.origin;
    openSheet('<h3>Réglages</h3>' +
      '<div class="field"><label class="muted">Jeton du serveur (ARCHIVETUNE_TOKEN)</label><input id="tok" type="password" value="' + esc(state.token) + '" placeholder="Mot de passe défini dans la stack"></div>' +
      '<button class="btn primary" id="tokSave">Enregistrer</button>' +
      '<h3 style="margin-top:24px">Pour les agents IA</h3>' +
      '<p class="muted" style="margin:0 0 8px">Home Assistant (intégration « Model Context Protocol »)</p><span class="code">' + esc(origin + '/sse?token=<jeton>') + '</span>' +
      '<p class="muted" style="margin:14px 0 8px">Serveur MCP récent (Claude, Gemini CLI…)</p><span class="code">' + esc(origin + '/mcp?token=<jeton>') + '</span>' +
      '<p class="muted" style="margin:14px 0 8px">Guide de l\'API</p><span class="code">' + esc(origin + '/api/help') + '</span>' +
      '<p class="muted" style="margin:14px 0 8px">Exemple simple</p><span class="code">' + esc(origin + '/api/play?q=Nightmare Avenged Sevenfold&type=album&device=Salon&token=<jeton>') + '</span>' +
      '<p class="muted" style="margin-top:18px;font-size:13px" id="ver"></p>');
    document.getElementById('tokSave').onclick = function () {
      state.token = document.getElementById('tok').value.trim();
      write('archivetune.token', state.token);
      closeSheet();
      toast('Jeton enregistré');
      route();
    };
    fetch('/api/health').then(function (r) { return r.json(); }).then(function (h) { document.getElementById('ver').textContent = 'ArchiveTune Server v' + h.version; }).catch(function () {});
  }
  function openNowPlaying() {
    var cast = isCast();
    var s = state.castStatus;
    var t = state.queue[state.index];
    var title = cast && s ? s.title : (t && t.title);
    var artist = cast && s ? s.artist : (t && t.artists.join(', '));
    var cover = cast && s ? s.thumbnail : (t && t.thumbnail);
    var upNext = state.queue.slice(state.index + 1, state.index + 31);
    openSheet('<div class="now"><img src="' + esc(thumb(cover, 544)) + '" alt=""><div style="font-size:20px;font-weight:600">' + esc(title || '') + '</div><div class="muted">' + esc(artist || '') + '</div>' +
      '<div class="muted" style="font-size:13px">' + (cast ? 'Sur ' + esc(state.device) : 'Sur ce navigateur') + '</div>' +
      '<div class="controls"><button class="ctrl" id="nPrev"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button><button class="ctrl main" id="nPlay"><svg viewBox="0 0 24 24">' + ((cast ? s && s.playerState === 'PLAYING' : !audio.paused) ? ICON_PAUSE : ICON_PLAY) + '</svg></button><button class="ctrl" id="nNext"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button></div>' +
      (cast ? '<input class="vol" id="vol" type="range" min="0" max="100" value="' + Math.round(((s && s.volume) || 0.5) * 100) + '">' : '') +
      '</div>' + (upNext.length ? '<h3 style="margin-top:18px">À suivre</h3><div class="list" id="upnext">' + upNext.map(function (u, i) { return trackRow(u, state.index + 1 + i); }).join('') + '</div>' : ''));
    document.getElementById('nPrev').onclick = function () { prev(); setTimeout(closeSheet, 150); };
    document.getElementById('nNext').onclick = function () { next(); setTimeout(closeSheet, 150); };
    document.getElementById('nPlay').onclick = function () { toggle(); setTimeout(closeSheet, 150); };
    var vol = document.getElementById('vol');
    if (vol) vol.onchange = function () { control('volume', (vol.value / 100).toFixed(2)); };
    var list = document.getElementById('upnext');
    if (list && !cast) {
      list.querySelectorAll('.row').forEach(function (r) {
        r.onclick = function () { state.index = +r.getAttribute('data-i'); startLocal(); closeSheet(); };
      });
    }
  }

  document.getElementById('deviceBtn').onclick = function () { openDevices(false); };
  document.getElementById('settingsBtn').onclick = openSettings;
  document.getElementById('pPlay').onclick = toggle;
  document.getElementById('pNext').onclick = next;
  document.getElementById('pPrev').onclick = prev;
  document.getElementById('pOpen').onclick = openNowPlaying;
  document.getElementById('pThumb').onclick = openNowPlaying;
  document.getElementById('searchForm').onsubmit = function (e) {
    e.preventDefault();
    go(document.getElementById('q').value);
  };
  document.querySelectorAll('.chip').forEach(function (c) {
    c.onclick = function () {
      state.type = c.getAttribute('data-type');
      syncChips();
      var q = document.getElementById('q').value.trim();
      if (q) location.hash = '#/search?type=' + state.type + '&q=' + encodeURIComponent(q);
      else showHome();
    };
  });
  var lastHash = location.hash || '#/';
  window.addEventListener('scroll', function () { scrolls[lastHash] = window.scrollY; }, { passive: true });
  window.addEventListener('hashchange', function () { closeSheet(); lastHash = location.hash || '#/'; window.scrollTo(0, 0); route(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });
  var qInput = document.getElementById('q');
  qInput.addEventListener('input', function () {
    var v = qInput.value.trim();
    document.getElementById('clearQ').style.display = qInput.value ? 'grid' : 'none';
    clearTimeout(suggestTimer);
    if (v.length < 2) return hideSuggest();
    var seq = ++suggestSeq;
    suggestTimer = setTimeout(function () {
      cachedApi('/api/suggest?q=' + encodeURIComponent(v)).then(function (list) { if (seq === suggestSeq && document.activeElement === qInput) showSuggest(list || []); }).catch(function () {});
    }, 220);
  });
  qInput.addEventListener('keydown', function (e) {
    var items = document.querySelectorAll('#suggest [data-s]');
    if (!items.length || document.getElementById('suggest').style.display === 'none') return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      suggestSel = (suggestSel + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
      items.forEach(function (it, i) { it.classList.toggle('sel', i === suggestSel); });
      qInput.value = items[suggestSel].getAttribute('data-s');
    } else if (e.key === 'Escape') hideSuggest();
  });
  qInput.addEventListener('blur', function () { setTimeout(hideSuggest, 120); });
  document.getElementById('clearQ').onclick = function () { qInput.value = ''; document.getElementById('clearQ').style.display = 'none'; qInput.focus(); hideSuggest(); };
  document.getElementById('deviceName').textContent = state.device || 'Ce navigateur';
  if (state.token) write('archivetune.token', state.token);
  route();
  if (!state.token) {
    api('/api/devices').catch(function () {});
  }
  if (isCast()) pollCast();
})();
</script>
</body>
</html>
